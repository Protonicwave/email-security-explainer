[project]
name = "email-security-explainer"
version = "0.1.0"
description = "Audits a domain's SPF and DMARC records and explains the gaps in plain English."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Shlok Bhusal", email = "92551449+Protonicwave@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.7",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C90", "PLR"]
# Assertions guard internal invariants; input is validated with exceptions.
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting relies on bare assert, and test tables use literal values.
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "vulture>=2.16",
]
